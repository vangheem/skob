[workspace]
resolver = "2"
members = [
    "crates/skob-core",
    "crates/skob-storage",
    "crates/skob-index",
    "crates/skob-raft",
    "crates/skob-server",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.1.0"
publish = false

[workspace.dependencies]
async-trait = "0.1"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v7", "serde"] }

skob-core = { path = "crates/skob-core" }
skob-storage = { path = "crates/skob-storage" }
skob-index = { path = "crates/skob-index" }
skob-raft = { path = "crates/skob-raft" }
